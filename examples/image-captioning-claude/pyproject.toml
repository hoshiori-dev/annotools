[project]
name = "image-captioning-claude"
version = "0.1.0"
description = "annotools example: caption COCO cat images with the Claude Agent SDK"
requires-python = ">=3.12"
dependencies = [
    "annotools",
    "claude-agent-sdk>=0.2",
]

[tool.uv.sources]
annotools = { path = "../..", editable = true }

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1", "ruff>=0.16", "ty>=0.0.75"]

[tool.ruff]
line-length = 120
extend-exclude = ["skills"]  # pinned copies of the annotools skills

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "captioning"
module-root = "src"
