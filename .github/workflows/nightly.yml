# Nightly image: what main looks like today, at ghcr.io/<repo>:nightly.
# 22:00 JST daily. Nothing else moves — no version tag, no latest, no PyPI. main has already passed CI,
# so this rebuilds, smoke-tests and content-scans the image rather than re-running the unit tests.
name: Nightly

on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC = 22:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        name: Skip when main has not moved
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The last successful run's head_sha is the commit the current :nightly was built from.
          # Reading it from the API needs no registry auth and works before the first image exists.
          last=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/runs?status=success&branch=main&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          if [ "$EVENT" = "schedule" ] && [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "main is still at $GITHUB_SHA, which :nightly already carries. Skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Building $GITHUB_SHA (previous nightly: ${last:-none})."
          fi

  nightly:
    needs: changed
    if: needs.changed.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # Build amd64 first and keep it local: the same layers serve the smoke test, the scan, and
      # (from the gha cache) the multi-arch push below.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: annotools:nightly
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Smoke test the container image
        run: uv run pytest -m container
        env:
          ANNOTOOLS_IMAGE: annotools:nightly
      - uses: ./.github/actions/scan-image
        with:
          image: annotools:nightly
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=nightly
          flavor: latest=false
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
