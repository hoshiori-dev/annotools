# Prepare a release: nothing is tagged until the full gate is green.
# Normal path: `gh workflow run release-prepare.yml` from the commit to release — the tag is derived
# from pyproject.toml. Pass `-f tag=v<version>` to assert what you believe you are releasing instead.
# The tag is created only after tests and artifact scanning pass, then a draft release is opened for
# review. A tag pushed by GITHUB_TOKEN raises no event, which is why one run does all three steps.
# Publishing that draft (as a person, not GITHUB_TOKEN) is what triggers release.yml.
name: Release Prepare

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example v0.1.0-rc1. Derived from pyproject.toml if left empty; must match it if given.
        required: false
        type: string
  push:
    # Fallback for a tag pushed by hand: the gate still runs before the draft release appears.
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  # The tag may not be known yet when it is derived, so serialize per ref instead. A tagless dispatch
  # and one naming the same version therefore land in different groups and both run; the loser fails
  # loudly when it pushes the tag, which is noisy but never produces two releases. Grouping per
  # workflow instead would serialize unrelated refs to prevent an operator mistake that announces
  # itself anyway.
  group: release-prepare-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - id: resolve
        name: Resolve the tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The push path arrives with its tag; a dispatch may name one or leave it to pyproject.toml.
          args=()
          if [ "$EVENT" = "push" ]; then
            args+=(--tag "$PUSHED_TAG" --existing-tag-ok)
          elif [ -n "$INPUT_TAG" ]; then
            args+=(--tag "$INPUT_TAG")
          fi
          # Fails before the test budget is spent if the version is already tagged, in any spelling.
          TAG=$(git ls-remote --tags origin \
            | uv run --no-project --with packaging scripts/prepare_release_tag.py "${args[@]}")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG"
          # Whether this is a pre-release is decided once, by check_release_version.py inside the
          # gate below, and read back from the workflow output.

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERROR: a release for $TAG already exists."
            exit 1
          fi

  tests:
    needs: resolve
    uses: ./.github/workflows/release-tests.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
    # ci.yml's pr-title job declares pull-requests: read; a called workflow may not exceed the caller's grant.
    permissions:
      contents: read
      pull-requests: read

  draft-release:
    needs: [resolve, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the tag
        # The push path arrives with the tag already in place.
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      # If this step fails after the tag was pushed, the guards in `resolve` will reject a re-run.
      # Recover with `git push origin --delete <tag>`, then dispatch again.
      - name: Open the draft release
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          PRERELEASE: ${{ needs.tests.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--draft --generate-notes --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"
          echo "Draft release $TAG is ready for review. Publishing it (as a person, not GITHUB_TOKEN) starts the Release workflow."
