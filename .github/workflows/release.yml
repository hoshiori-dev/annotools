# Publish: re-run the full gate (tests + artifact scanning), then ship.
# Trigger: publishing the draft release that release-prepare.yml created. Publishing must be done by a
# person or a user token — a draft published with GITHUB_TOKEN raises no event and nothing ships.
# Every release uploads to TestPyPI; a full release then continues to PyPI and updates the
# <major>.<minor> and latest image tags. A pre-release stops at TestPyPI (a rehearsal and
# developer-test channel, not a documented install path) and only moves its own version image tag.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  tests:
    uses: ./.github/workflows/release-tests.yml
    with:
      tag: ${{ github.event.release.tag_name }}
    # ci.yml's pr-title job declares pull-requests: read; a called workflow may not exceed the caller's grant.
    permissions:
      contents: read
      pull-requests: read

  publish-ghcr:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # semver patterns skip major.minor for pre-releases; latest=auto skips pre-releases too.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=auto
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every release goes to TestPyPI first, so the path that matters is never exercised for the first
  # time on PyPI. Only a full release continues, with the artifact this run just built and scanned.
  publish-testpypi:
    needs: tests
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # Re-running a release whose PyPI step failed must not trip over this upload.
          skip-existing: true

  publish-pypi:
    needs: [tests, publish-testpypi]
    # The tag's PEP 440 version decides, not the release's prerelease checkbox — the checkbox is
    # descriptive, and letting it choose the index would put a pre-release on PyPI permanently.
    if: needs.tests.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://upload.pypi.org/legacy/
