# Publish: re-run the full gate (tests + artifact scanning), then ship.
# Trigger: publishing the draft release that release-prepare.yml created. Publishing must be done by a
# person or a user token — a draft published with GITHUB_TOKEN raises no event and nothing ships.
# A full release goes to PyPI and updates the <major>.<minor> and latest image tags; a pre-release goes
# to TestPyPI (a rehearsal and developer-test channel, not a documented install path) and only moves
# its own version image tag.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  tests:
    uses: ./.github/workflows/release-tests.yml
    with:
      tag: ${{ github.event.release.tag_name }}
    # ci.yml's pr-title job declares pull-requests: read; a called workflow may not exceed the caller's grant.
    permissions:
      contents: read
      pull-requests: read

  publish-ghcr:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # semver patterns skip major.minor for pre-releases; latest=auto skips pre-releases too.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=auto
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-pypi:
    needs: tests
    runs-on: ubuntu-latest
    # The environment name is half the OIDC claim the index checks, so it selects the index as surely
    # as repository-url does: pre-release -> TestPyPI, full release -> PyPI.
    environment: ${{ github.event.release.prerelease && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: ${{ github.event.release.prerelease && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
