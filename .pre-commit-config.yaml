# Hooks mirror `just check`; keep tool versions here aligned with the dev dependency group in pyproject.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
        args: ["--fix=auto"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: gen-mcp-reference-check
        name: docs/mcp/tools.md is current
        entry: uv run scripts/gen_mcp_reference.py --check
        language: system
        pass_filenames: false
        files: ^(src/annotools/|\.agents/knowledge/spec/|docs/mcp/|scripts/gen_mcp_reference\.py)

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.6
    hooks:
      - id: uv-lock

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
